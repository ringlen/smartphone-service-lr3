syntax = "proto3";
package smartphone;

option go_package = "example.com/smartphonepb";

service SmartphoneService {
  rpc RegisterSmartphone   (SmartphoneRequest)       returns (SmartphoneReceipt);
  rpc GetSmartphone        (GetSmartphoneRequest)    returns (Smartphone);
  rpc ListSmartphones      (ListSmartphonesRequest)  returns (ListSmartphonesResponse);
}

message SmartphoneSpecs {
  float  display_inch = 1;
  int32  ram_gb       = 2;
  int32  storage_gb   = 3;
  string os           = 4;
}

message SmartphoneRequest {
  string          manufacturer_id = 1;
  string          model           = 2;
  SmartphoneSpecs specs           = 3;
}

message GetSmartphoneRequest {
  string device_id = 1;
}

message ListSmartphonesRequest {
  string manufacturer_id = 1;
  int32  limit           = 2;
  int32  offset          = 3;
}

message SmartphoneReceipt {
  string device_id = 1;
  string status    = 2;
}

message Smartphone {
  string          device_id       = 1;
  string          manufacturer_id = 2;
  string          model           = 3;
  SmartphoneSpecs specs           = 4;
  string          status          = 5;
}

message ListSmartphonesResponse {
  repeated Smartphone smartphones = 1;
}